name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: matter-guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned to a full commit SHA: a tag is mutable and can be repointed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Restore locked dependencies on Windows
        if: runner.os == 'Windows'
        run: python -m pip install --require-hashes -r requirements-lock.txt

      # The documented command, unchanged. If this needs an argument or an
      # environment variable to pass, the documentation is wrong.
      - name: Hook tests
        run: node tests/matter-guard.test.js

      - name: Hook syntax
        run: node --check hooks/matter-guard.js

      - name: Documentation control claims
        run: node tests/docs-control-claims.test.js

      - name: Text scanner regressions
        run: node tests/scan-history.test.js

      - name: Office scanner regressions
        run: node tests/scan-docx-xml.test.js

      # The end-to-end tier launches real Claude Code sessions and needs a
      # signed-in installation, so it cannot run here. It is checked for syntax
      # so a broken file is caught, and run by hand before a release.
      - name: End-to-end tier syntax
        run: node --check tests/e2e.test.js

  settings:
    name: settings and policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Full offline verification
        run: python scripts/verify.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the tip
      # gitleaks-action requires a paid licence for organisation-owned
      # repositories, so it can never pass here. This is a dependency-free
      # scan of the same history; GitHub secret scanning and push protection
      # should be enabled as well before the repository is made public.
      - name: Scan history and pending changes
        run: python3 scripts/scan-history.py --worktree

      - name: History scanner tests
        run: node tests/scan-history.test.js

      - name: Scan Office XML
        run: python3 scripts/scan-docx-xml.py --history --worktree

      - name: Office XML scanner tests
        run: node tests/scan-docx-xml.test.js
