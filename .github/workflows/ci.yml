name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: matter-guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned to a full commit SHA: a tag is mutable and can be repointed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The documented command, unchanged. If this needs an argument or an
      # environment variable to pass, the documentation is wrong.
      - name: Hook tests
        run: node tests/matter-guard.test.js

      - name: Hook syntax
        run: node --check hooks/matter-guard.js

      # Preflight has two modes and they answer different questions. These tests
      # pin the distinction: a placeholder is expected in the template and is a
      # blocker in a rendered production file. Without them, a future change that
      # relaxed production mode would look like a passing build.
      - name: Preflight validation tests
        run: node tests/preflight-validate.test.js

      - name: Production settings renderer tests
        run: node tests/render-production-settings.test.js

      # The end-to-end tier launches real Claude Code sessions and needs a
      # signed-in installation, so it cannot run here. It is checked for syntax
      # so a broken file is caught, and run by hand before a release.
      - name: End-to-end tier syntax
        run: node --check tests/e2e.test.js

  settings:
    name: settings and policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate JSON
        run: |
          for f in managed-settings.json settings.json matter-settings.json; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print(sys.argv[1], 'ok')" "$f"
          done

      - name: Validate settings schema
        run: |
          pip install check-jsonschema --quiet
          check-jsonschema --schemafile https://json.schemastore.org/claude-code-settings.json managed-settings.json settings.json matter-settings.json

      - name: Install converter dependencies
        run: pip install -r requirements.txt

      # The Markdown policy is generated. If it has drifted from the DOCX, the
      # repository is publishing something the authoritative document does not
      # say.
      - name: Policy Markdown is in step with the DOCX
        run: |
          for d in ai-policy-legal-practice-template ai-protocol-barristers-chambers; do
            python scripts/docx-to-md.py "$d.docx" "/tmp/$d.regen.md"
            diff -u "$d.md" "/tmp/$d.regen.md"
          done

      # Clause references are load-bearing: the settings, the skill and the
      # README all cite them, and a renumbered policy silently invalidates them.
      - name: Clause references resolve
        run: python scripts/check-clause-refs.py

      # Template mode: placeholders are intentional and reported as warnings.
      # Structural faults (missing hooks, invalid mode) still fail the build.
      # Production mode is a release gate against a rendered, non-committed file
      # and cannot run here without firm-specific values.
      - name: Preflight validate template
        run: python3 scripts/preflight-validate.py --mode template managed-settings.json

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the tip
      # gitleaks-action requires a paid licence for organisation-owned
      # repositories, so it can never pass here. This is a dependency-free
      # scan of the same history; GitHub secret scanning and push protection
      # should be enabled as well before the repository is made public.
      - name: Scan full history
        run: python scripts/scan-history.py
